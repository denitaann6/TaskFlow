<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Project Management System</title>
  <meta name="description" content="TaskFlow — Professional Project Management System with MySQL persistence, team workload distribution, and milestone tracking.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script src="js/api.js?v=4.0"></script>
  <script>
    // Immediate smart routing
    const user = (window.API || API).getUser();
    const token = (window.API || API).getToken();
    if (user && token) {
      window.location.replace('dashboard.html');
    } else {
      window.location.replace('login.html');
    }
  </script>
</head>
<body style="background-color: #0f172a; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div style="text-align: center; padding: 24px;">
    <img src="assets/logo.svg" alt="TaskFlow" width="64" height="64" style="margin-bottom: 16px;">
    <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;">TaskFlow</h1>
    <p style="color: var(--slate-400); font-size: 0.9rem; margin-bottom: 16px;">Redirecting to your workspace...</p>
    <div style="display: flex; gap: 12px; justify-content: center;">
      <a href="login.html" class="btn btn-primary btn-sm">Go to Sign In</a>
      <a href="dashboard.html" class="btn btn-secondary btn-sm">Go to Dashboard</a>
    </div>
  </div>
</body>
</html>
