<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" fill="none">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background decorative geometric shapes -->
  <circle cx="270" cy="210" r="160" fill="#EEF2F6" opacity="0.8"/>
  <circle cx="430" cy="110" r="40" fill="#E0E7FF" opacity="0.6"/>
  <rect x="50" y="270" width="70" height="70" rx="16" fill="#EDE9FE" opacity="0.6"/>

  <!-- Main Board Card -->
  <g filter="url(#softShadow)">
    <rect x="90" y="60" width="360" height="280" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Header of Board -->
    <rect x="90" y="60" width="360" height="46" rx="20" fill="#F8FAFC"/>
    <path d="M90 86H450V106H90V86Z" fill="#F8FAFC"/>
    <line x1="90" y1="106" x2="450" y2="106" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="116" cy="83" r="5" fill="#EF4444"/>
    <circle cx="132" cy="83" r="5" fill="#F59E0B"/>
    <circle cx="148" cy="83" r="5" fill="#10B981"/>
    <rect x="180" y="77" width="120" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="390" y="76" width="38" height="14" rx="7" fill="#E0E7FF"/>
  </g>

  <!-- Kanban Column 1: Pending -->
  <g>
    <rect x="114" y="124" width="94" height="190" rx="10" fill="#F8FAFC" stroke="#F1F5F9"/>
    <text x="124" y="142" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">PENDING</text>
    
    <!-- Task Card A -->
    <rect x="120" y="152" width="82" height="64" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="128" y="162" width="56" height="6" rx="3" fill="#0F172A"/>
    <rect x="128" y="174" width="40" height="4" rx="2" fill="#94A3B8"/>
    <rect x="128" y="196" width="32" height="12" rx="4" fill="#FEF3C7"/>
    <text x="133" y="205" font-family="sans-serif" font-size="8" font-weight="600" fill="#D97706">HIGH</text>

    <!-- Task Card B -->
    <rect x="120" y="224" width="82" height="54" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="128" y="234" width="48" height="6" rx="3" fill="#0F172A"/>
    <rect x="128" y="246" width="34" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- Kanban Column 2: In Progress -->
  <g>
    <rect x="222" y="124" width="94" height="190" rx="10" fill="#F8FAFC" stroke="#F1F5F9"/>
    <text x="232" y="142" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2563EB">ACTIVE</text>

    <!-- Task Card In Progress -->
    <rect x="228" y="152" width="82" height="74" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="236" y="162" width="54" height="6" rx="3" fill="#1E40AF"/>
    <rect x="236" y="174" width="60" height="4" rx="2" fill="#94A3B8"/>
    <rect x="236" y="198" width="66" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="236" y="198" width="45" height="5" rx="2.5" fill="url(#accentGrad)"/>
    <rect x="236" y="210" width="34" height="10" rx="4" fill="#DBEAFE"/>
    <text x="240" y="218" font-family="sans-serif" font-size="7" font-weight="600" fill="#1D4ED8">RUNNING</text>
  </g>

  <!-- Kanban Column 3: Completed -->
  <g>
    <rect x="330" y="124" width="94" height="190" rx="10" fill="#F8FAFC" stroke="#F1F5F9"/>
    <text x="340" y="142" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#059669">DONE</text>

    <!-- Task Card Done -->
    <rect x="336" y="152" width="82" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="348" cy="166" r="6" fill="#D1FAE5"/>
    <path d="M345 166L347 168L351 164" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="358" y="163" width="50" height="6" rx="3" fill="#64748B"/>
    <rect x="344" y="184" width="46" height="12" rx="4" fill="#ECFDF5"/>
    <text x="349" y="193" font-family="sans-serif" font-size="8" font-weight="600" fill="#059669">VERIFIED</text>
  </g>

  <!-- Floating Security / Auth Shield Badge -->
  <g filter="url(#softShadow)">
    <rect x="370" y="260" width="130" height="110" rx="16" fill="url(#cardGrad1)"/>
    <circle cx="435" cy="298" r="22" fill="#334155"/>
    <!-- Shield Icon -->
    <path d="M435 284L447 289V298C447 307 442 314 435 317C428 314 423 307 423 298V289L435 284Z" fill="url(#shieldGrad)"/>
    <path d="M432 299L434.5 301.5L438.5 296" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="435" y="334" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">ROLE-BASED AUTH</text>
    <text x="435" y="348" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="500" fill="#94A3B8">BCrypt &amp; Session Guard</text>
  </g>

  <!-- Floating Metric Pill -->
  <g filter="url(#softShadow)">
    <rect x="40" y="110" width="124" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="62" cy="134" r="12" fill="#EEF2FF"/>
    <path d="M57 134L60 137L67 130" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="128" font-family="sans-serif" font-size="9" font-weight="600" fill="#64748B">12 TASKS MAPPED</text>
    <text x="80" y="143" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">100% Intact</text>
  </g>
</svg>
