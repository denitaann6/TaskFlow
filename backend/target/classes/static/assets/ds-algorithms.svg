<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" fill="none">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Background decorative -->
  <circle cx="190" cy="90" r="80" fill="#F1F5F9" opacity="0.6"/>

  <!-- Tree Structure Lines -->
  <line x1="190" y1="40" x2="120" y2="90" stroke="#94A3B8" stroke-width="2"/>
  <line x1="190" y1="40" x2="260" y2="90" stroke="#94A3B8" stroke-width="2"/>
  <line x1="120" y1="90" x2="80" y2="140" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="120" y1="90" x2="160" y2="140" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="260" y1="90" x2="220" y2="140" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="260" y1="90" x2="300" y2="140" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Root Node -->
  <circle cx="190" cy="40" r="18" fill="url(#nodeGrad)"/>
  <text x="190" y="45" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">BST</text>

  <!-- Level 1 Nodes -->
  <circle cx="120" cy="90" r="15" fill="#1E293B"/>
  <text x="120" y="94" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Left</text>

  <circle cx="260" cy="90" r="15" fill="#1E293B"/>
  <text x="260" y="94" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Right</text>

  <!-- Leaf Nodes -->
  <circle cx="80" cy="140" r="12" fill="url(#leafGrad)"/>
  <text x="80" y="144" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">101</text>

  <circle cx="160" cy="140" r="12" fill="url(#leafGrad)"/>
  <text x="160" y="144" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">105</text>

  <circle cx="220" cy="140" r="12" fill="url(#leafGrad)"/>
  <text x="220" y="144" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">110</text>

  <circle cx="300" cy="140" r="12" fill="url(#leafGrad)"/>
  <text x="300" y="144" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">115</text>
</svg>
